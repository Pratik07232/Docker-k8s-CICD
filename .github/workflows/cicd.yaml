name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test application
        run: |
          python -m py_compile app.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.pratik78124 }}
          password: ${{ secrets.dckr_pat_qw6mmVX2wPP9q6dgjteh_wGa03g }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.pratik78124 }}/flask-k8s-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.pratik78124 }}/flask-k8s-app:latest